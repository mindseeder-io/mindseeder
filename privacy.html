<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="mindseeder Privacy Policy">
    <title>Privacy Policy — mindseeder</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #111111;
            color: #cccccc;
            margin: 0;
            padding: 0;
        }

        .lang-toggle {
            position: fixed;
            top: 20px;
            right: 24px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 5px 12px;
            font-size: 0.78rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active { border-color: #ff9e00; color: #ff9e00; background: rgba(255,158,0,0.08); }
        .lang-btn:hover:not(.active) { border-color: #666; color: #ccc; }

        .doc-header {
            background: linear-gradient(135deg, #1a1a1a, #222);
            border-bottom: 1px solid #2a2a2a;
            padding: 48px 24px 32px;
            text-align: center;
        }

        .doc-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 8px;
        }

        .doc-header .effective {
            font-size: 0.85rem;
            color: #666;
        }

        .doc-body {
            max-width: 760px;
            margin: 0 auto;
            padding: 40px 24px 60px;
            line-height: 1.75;
        }

        h2 {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 8px;
            margin-top: 2.2em;
            margin-bottom: 0.8em;
        }

        p { margin: 0.6em 0 1em; color: #bbb; }
        ul { color: #bbb; padding-left: 1.4em; }
        ul li { margin-bottom: 6px; }
        a { color: #ff9e00; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .back-link {
            display: inline-block;
            margin-top: 2em;
            color: #888;
            font-size: 0.9rem;
        }

        .back-link:hover { color: #fff; }

        footer {
            border-top: 1px solid #222;
            text-align: center;
            padding: 20px 24px;
            font-size: 0.8rem;
            color: #555;
        }

        @media (max-width: 480px) {
            .doc-header h1 { font-size: 1.4rem; }
        }

</head>
<body>

    <nav class="lang-toggle" aria-label="Language selector">

            }
        };

        function setLang(lang) {
            const t = content[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key] !== undefined) el.innerHTML = t[key];
            });
            document.getElementById('doc-content').innerHTML = t.body;
            document.documentElement.lang = lang;
            localStorage.setItem('ms_lang', lang);
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
        }

        const saved = localStorage.getItem('ms_lang');
        const auto = saved || (navigator.language && navigator.language.startsWith('ko') ? 'ko' : 'en');
        setLang(auto);
